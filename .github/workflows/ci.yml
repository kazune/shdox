name: Cross-platform CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test and verify the Linux binary
        run: make ci

      - name: Package Linux release archive
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_ASSET_DIR: ${{ runner.temp }}/release-assets
        run: bash scripts/package-release.sh

      - name: Upload Linux release archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: shdox-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-assets/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    env:
      GOOS: darwin
      GOARCH: ${{ matrix.arch }}
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Ensure ShellCheck is available
        run: command -v shellcheck || brew install shellcheck

      - name: Test and verify the macOS binary
        run: make ci

      - name: Package macOS release archive
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_ASSET_DIR: ${{ runner.temp }}/release-assets
        run: bash scripts/package-release.sh

      - name: Upload macOS release archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: shdox-${{ github.ref_name }}-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-assets/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: shdox-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: LC_ALL=C sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS.txt \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS.txt \
              --verify-tag --generate-notes --title "shdox ${tag#v}" --repo "$GITHUB_REPOSITORY"
          fi
